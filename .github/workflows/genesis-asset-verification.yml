name: Genesis asset verification
on:
  push:
    branches: [dot/genesis-asset-refresh]
  pull_request:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/verify.ps1'
      - '.github/workflows/genesis-asset-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare Godot 4.7.2 and virtual display
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          zip="$RUNNER_TEMP/godot.zip"
          curl --fail --silent --show-error --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$zip"
          printf '%s  %s\n' cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4 "$zip" | sha256sum -c
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Verify generated assets and real campaign builds
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/gines-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/gines-cache"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$RUNNER_TEMP/gines-screens"
          (cd game && sha256sum -c ../docs/GENESIS-ASSETS.sha256)
          "$GODOT" --headless --audio-driver Dummy --path game --import
          "$GODOT" --headless --audio-driver Dummy --path game --script res://tests/genesis_art_check.gd -- --require-art
          "$GODOT" --headless --audio-driver Dummy --path game --script res://tests/asset_audio_check.gd
          xvfb-run -a -s '-screen 0 1920x1080x24' pwsh -NoProfile -File tools/verify.ps1 -Godot "$GODOT" -OutDir "$RUNNER_TEMP/gines-screens"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genesis-generated-art-screenshots
          path: ${{ runner.temp }}/gines-screens/*.png
          if-no-files-found: warn
          retention-days: 14
