<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b2226"/>
      <stop offset="100%" stop-color="#040d10"/>
    </radialGradient>
    <radialGradient id="membrane" cx="42%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#8fe3d2" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#3aa896" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#14615e" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="nucleus" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="55%" stop-color="#f3c45c"/>
      <stop offset="100%" stop-color="#b97921" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- baseline and divider ticks -->
  <line x1="60" y1="392" x2="900" y2="392" stroke="#3d7c76" stroke-opacity="0.45" stroke-width="1"/>
  <g stroke="#c9a253" stroke-opacity="0.35" stroke-width="1">
    <line x1="200" y1="118" x2="200" y2="410"/>
    <line x1="360" y1="118" x2="360" y2="410"/>
    <line x1="520" y1="118" x2="520" y2="410"/>
    <line x1="680" y1="118" x2="680" y2="410"/>
  </g>

  <!-- 1: single cell -->
  <g transform="translate(120 300)">
    <ellipse rx="34" ry="30" fill="#54c6b4" opacity="0.16" filter="url(#soft)"/>
    <ellipse rx="30" ry="26" fill="url(#membrane)" stroke="#9fe9d8" stroke-opacity="0.7" stroke-width="1.5"/>
    <g stroke="#bff2e2" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round">
      <line x1="-28" y1="-6" x2="-40" y2="-11"/><line x1="-25" y1="10" x2="-38" y2="17"/>
      <line x1="-4" y1="-25" x2="-8" y2="-38"/><line x1="16" y1="-20" x2="24" y2="-32"/>
      <line x1="26" y1="2" x2="39" y2="3"/><line x1="12" y1="22" x2="17" y2="35"/>
    </g>
    <circle r="10" fill="url(#nucleus)" filter="url(#glow)"/>
  </g>

  <!-- 2: early swimming organism -->
  <g transform="translate(280 300)">
    <ellipse rx="60" ry="34" fill="#54c6b4" opacity="0.14" filter="url(#soft)"/>
    <path d="M-58 0 C-44 -34 34 -36 58 -10 C70 4 54 26 24 31 C-12 38 -50 22 -58 0 Z"
          fill="url(#membrane)" stroke="#9fe9d8" stroke-opacity="0.72" stroke-width="1.6"/>
    <g stroke="#bff2e2" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round">
      <line x1="-42" y1="-14" x2="-56" y2="-24"/><line x1="-22" y1="-27" x2="-30" y2="-41"/>
      <line x1="6" y1="-30" x2="10" y2="-44"/><line x1="34" y1="-22" x2="44" y2="-34"/>
      <line x1="-30" y1="22" x2="-44" y2="34"/><line x1="4" y1="30" x2="8" y2="44"/>
    </g>
    <ellipse cx="-18" cy="2" rx="12" ry="9" fill="#0d3b3c" opacity="0.5"/>
    <circle r="11" fill="url(#nucleus)" filter="url(#glow)"/>
  </g>

  <!-- 3: first evolution, earned spike ring -->
  <g transform="translate(440 300)">
    <ellipse rx="68" ry="42" fill="#54c6b4" opacity="0.16" filter="url(#soft)"/>
    <g stroke="#f3c45c" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-52"/><line x1="18" y1="-26" x2="30" y2="-45"/>
      <line x1="31" y1="-8" x2="52" y2="-16"/><line x1="31" y1="12" x2="52" y2="20"/>
      <line x1="16" y1="28" x2="28" y2="47"/><line x1="-4" y1="32" x2="-7" y2="54"/>
      <line x1="-24" y1="25" x2="-38" y2="43"/><line x1="-33" y1="5" x2="-54" y2="11"/>
      <line x1="-30" y1="-15" x2="-49" y2="-27"/><line x1="-16" y1="-29" x2="-27" y2="-47"/>
    </g>
    <path d="M-56 0 C-44 -32 32 -34 56 -8 C68 6 50 26 22 30 C-12 36 -48 20 -56 0 Z"
          fill="url(#membrane)" stroke="#ffe6a4" stroke-opacity="0.85" stroke-width="1.8"/>
    <circle r="13" fill="url(#nucleus)" filter="url(#glow)"/>
  </g>

  <!-- 4: differentiated body, directional part -->
  <g transform="translate(600 300)">
    <ellipse rx="70" ry="40" fill="#54c6b4" opacity="0.15" filter="url(#soft)"/>
    <path d="M-60 4 C-48 -28 20 -30 48 -14 C62 -6 74 -14 84 -24 C78 -4 78 12 84 30 C70 20 58 26 46 24 C18 36 -42 30 -60 4 Z"
          fill="url(#membrane)" stroke="#9fe9d8" stroke-opacity="0.75" stroke-width="1.6"/>
    <path d="M-30 -18 C-8 -34 24 -28 38 -12 C18 -18 -6 -12 -30 -18 Z" fill="#ffe3a0" opacity="0.28"/>
    <path d="M20 18 C36 10 52 12 62 20 C46 26 30 26 20 18 Z" fill="#1c7d72" opacity="0.7"/>
    <ellipse cx="-34" cy="4" rx="10" ry="7" fill="#0d3b3c" opacity="0.55"/>
    <circle r="12" fill="url(#nucleus)" filter="url(#glow)"/>
  </g>

  <!-- 5: late pre-birth form, still the same creature -->
  <g transform="translate(790 300)">
    <ellipse rx="78" ry="46" fill="#54c6b4" opacity="0.16" filter="url(#soft)"/>
    <path d="M-66 4 C-58 -26 -30 -38 4 -34 C36 -30 62 -16 72 2 C62 24 38 34 4 34 C-34 34 -60 24 -66 4 Z"
          fill="url(#membrane)" stroke="#ffe6a4" stroke-opacity="0.8" stroke-width="1.8"/>
    <path d="M-52 -6 C-38 -24 -6 -28 18 -22 C-6 -18 -30 -8 -52 -6 Z" fill="#d9f6ea" opacity="0.22"/>
    <path d="M-40 16 C-14 8 18 10 40 20 C12 30 -18 30 -40 16 Z" fill="#1c7d72" opacity="0.62"/>
    <g fill="#8fe3d2" opacity="0.55">
      <ellipse cx="-44" cy="-2" rx="5" ry="3"/>
      <ellipse cx="46" cy="-8" rx="6" ry="4"/>
      <ellipse cx="30" cy="22" rx="4" ry="3"/>
    </g>
    <g stroke="#f3c45c" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round">
      <line x1="-58" y1="-14" x2="-66" y2="-25"/>
      <line x1="-58" y1="18" x2="-68" y2="28"/>
      <line x1="60" y1="10" x2="72" y2="16"/>
    </g>
    <circle r="14" fill="url(#nucleus)" filter="url(#glow)"/>
  </g>
</svg>
